<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Crazy Gift</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --panel-glass: rgba(22, 16, 48, 0.78);
      --panel-border: rgba(168, 85, 247, 0.28);
      --accent-purple: #9333ea;
      --accent-gold: #facc15;
      --accent-blue: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --nav-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, #2a144e 0%, transparent 60%),
        radial-gradient(circle at 10% 85%, #180d38 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, #0d122e 0%, transparent 40%);
      color: var(--text-white);
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    /* ========================================================= */
    /* ВЕРХНЯЯ ШАПКА: TOP SLOT & БАЛАНС                         */
    /* ========================================================= */
    .top-header {
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
    }

    .top-slot-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(25, 18, 54, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .top-slot-result {
      display: none;
      align-items: center;
      gap: 5px;
    }
    .top-slot-result.visible {
      display: flex;
      animation: popBadge 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ts-symbol-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 11px;
      color: #fff;
    }
    .ts-mult-badge {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      padding: 2px 7px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .diamond-icon {
      width: 17px;
      height: 17px;
      fill: #38bdf8;
      filter: drop-shadow(0 0 5px #38bdf8);
    }
    .balance-num {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    /* ВКЛАДКИ */
    .tab-content {
      display: none;
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* ========================================================= */
    /* СТРАНИЦА: CRAZY GIFT (ИГРА)                              */
    /* ========================================================= */
    .game-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 0;
      position: relative;
      overflow: hidden;
      padding-bottom: 6px;
    }

    /* ЗОНА КОЛЕСА С ЗУМОМ */
    .wheel-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
    }

    .wheel-rig {
      width: 320px;
      height: 320px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 11%;
      transition: transform 1.7s cubic-bezier(0.18, 0.85, 0.25, 1);
    }
    /* ЭКСТРЕМАЛЬНОЕ ПРИБЛИЖЕНИЕ (КАК НА СКРИНШОТЕ 00:14) */
    .wheel-rig.super-zoom {
      transform: scale(2.35) translateY(44px);
    }

    /* УКАЗАТЕЛЬ / СТРЕЛКА (КАПЛЯ) */
    .pointer-wrap {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      width: 28px;
      height: 38px;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.85));
    }
    .pointer-svg {
      width: 100%;
      height: 100%;
      transform-origin: 50% 15%;
      transition: transform 0.04s ease-out;
    }

    canvas#crazyWheelCanvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    /* ПЛАВАЮЩАЯ ПАНЕЛЬ СТАВОК (КАК НА ВИДЕО) */
    .betting-console {
      width: calc(100% - 20px);
      max-width: 410px;
      background: linear-gradient(180deg, rgba(32, 22, 65, 0.92) 0%, rgba(18, 12, 38, 0.96) 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: 10px 10px 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
      transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.25, 1), opacity 0.5s;
    }
    /* Панель уезжает вниз при супер-зуме */
    .betting-console.slide-down {
      transform: translateY(140px);
      opacity: 0.2;
      pointer-events: none;
    }

    /* 8 КНОПОК СТАВОК (2 РЯДА ПО 4 КНОПКИ) */
    .bets-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }

    .bet-btn {
      height: 48px;
      border-radius: 14px;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.1s ease, filter 0.2s;
    }
    .bet-btn:active {
      transform: scale(0.95);
    }
    .bet-btn.locked {
      pointer-events: none;
      filter: brightness(0.9);
    }
    .bet-btn .label {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      line-height: 1.1;
      text-align: center;
    }

    /* Цвета кнопок 1 в 1 как на видео */
    .bet-btn.c-1 { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); }
    .bet-btn.c-2 { background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); }
    .bet-btn.c-5 { background: linear-gradient(180deg, #f472b6 0%, #db2777 100%); }
    .bet-btn.c-10 { background: linear-gradient(180deg, #c084fc 0%, #7c3aed 100%); }

    .bet-btn.c-coin { background: linear-gradient(180deg, #f87171 0%, #dc2626 100%); }
    .bet-btn.c-cash { background: linear-gradient(180deg, #34d399 0%, #059669 100%); }
    .bet-btn.c-pach { background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%); }
    .bet-btn.c-crazy { background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border: 1px solid #facc15; }

    .bet-btn.c-coin .label,
    .bet-btn.c-cash .label,
    .bet-btn.c-pach .label,
    .bet-btn.c-crazy .label {
      font-size: 11px;
    }

    /* Фишка ставки на кнопке */
    .chip-badge {
      position: absolute;
      top: -4px;
      left: -4px;
      background: #facc15;
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: none;
    }
    .chip-badge.active { display: block; }

    .mult-badge-on-btn {
      position: absolute;
      top: -4px;
      right: -4px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: none;
    }
    .mult-badge-on-btn.active { display: block; }

    /* НИЖНИЙ РЯД УПРАВЛЕНИЯ СТАВКОЙ */
    .console-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 4px;
    }

    .bet-stepper {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(10, 6, 26, 0.75);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 4px 8px;
      border-radius: 20px;
    }

    .step-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .step-btn:active { transform: scale(0.92); }

    .bet-display {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
    }
    .bet-display input {
      width: 44px;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }

    .refresh-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }
    .refresh-btn:active { transform: scale(0.92); }

    /* ПРАВАЯ КНОПКА СТАТУСА: СТАВКИ / КРУТИТСЯ (БЕЗ РАЗМЫТИЯ) */
    .status-capsule {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #170d2c;
      padding: 4px 14px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 95px;
      box-shadow: 0 4px 12px rgba(250, 204, 21, 0.35);
      transition: all 0.3s ease;
    }
    .status-capsule.spinning {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
    }
    .sc-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sc-timer {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
    }
    .sc-sub {
      font-size: 9px;
      font-weight: 600;
      opacity: 0.9;
    }

    /* ========================================================= */
    /* ПОПАП РЕЗУЛЬТАТОВ (1 В 1 СО СКРИНШОТА 00:19)              */
    /* ========================================================= */
    .result-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(4, 5, 12, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-popup-overlay.show {
      display: flex;
    }
    .result-card-modal {
      width: 100%;
      max-width: 320px;
      background: linear-gradient(180deg, #1d1838 0%, #100d23 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 28px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(147, 51, 234, 0.3);
      animation: popBadge 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-winner-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .mwb-symbol {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 13px;
      color: #fff;
    }
    .mwb-mult {
      color: var(--accent-gold);
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 15px;
    }
    .modal-user-status {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .modal-payout {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ========================================================= */
    /* СТРАНИЦА: ИНВЕНТАРЬ (С ПРОЗРАЧНЫМ PLUSH PEPE)             */
    /* ========================================================= */
    .inventory-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }
    .pepe-ghost-svg {
      position: absolute;
      width: 290px;
      height: 290px;
      opacity: 0.12;
      pointer-events: none;
      filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.4));
    }
    .inv-empty-card {
      background: var(--panel-glass);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      max-width: 300px;
      z-index: 2;
    }

    /* ========================================================= */
    /* СТРАНИЦА: ПРОФИЛЬ                                         */
    /* ========================================================= */
    .profile-screen {
      flex: 1;
      padding: 12px 14px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .profile-hero-card {
      width: 100%;
      background: linear-gradient(180deg, #24164b 0%, #120c29 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: 18px 20px;
    }
    .hero-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hero-avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .hero-avatar {
      width: 66px;
      height: 66px;
      border-radius: 20px;
      background: linear-gradient(180deg, #7c3aed 0%, #4f46e5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    .hero-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .hero-avatar svg { width: 36px; height: 36px; fill: rgba(255, 255, 255, 0.85); }
    .hero-username {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .hero-balance-block { text-align: right; }
    .hero-balance-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .hero-balance-amount {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #fff;
    }

    .hero-actions-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-deposit-white {
      flex: 1;
      height: 44px;
      background: #f0f5ff;
      color: #08111e;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-withdraw-dark {
      flex: 1;
      height: 44px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .promo-dock-box {
      background: var(--panel-glass);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .promo-input-field {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      text-transform: uppercase;
    }
    .promo-submit-btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .history-feed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item-row {
      background: var(--panel-glass);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hist-left { display: flex; align-items: center; gap: 10px; }
    .hist-circle-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid rgba(124, 58, 237, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hist-circle-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.2;
    }
    .hist-type { font-size: 13px; font-weight: 700; color: #fff; }
    .hist-time { font-size: 11px; color: var(--text-muted); }
    .hist-sum {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
    }
    .hist-sum.pos { color: #10b981; }
    .hist-sum.neg { color: #f87171; }

    /* ========================================================= */
    /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (1 В 1 СО СКРИНШОТА)             */
    /* ========================================================= */
    .bottom-nav {
      height: var(--nav-height);
      flex-shrink: 0;
      padding: 0 16px;
      margin: 0 12px 10px;
      background: rgba(16, 11, 36, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 16px;
      transition: all 0.2s;
      position: relative;
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    .nav-btn.active {
      color: #fff;
      background: rgba(124, 58, 237, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .nav-btn.active svg {
      stroke: #facc15;
      filter: drop-shadow(0 0 6px #facc15);
    }

    .nav-badge-pill {
      position: absolute;
      top: 3px;
      right: 14px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 0 4px;
      border-radius: 8px;
    }

    @keyframes popBadge {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ========================================================= */

    /* ========================================================= */
    const CRAZY_SECTORS = [

      { id: "5", label: "5", mult: 5, color: "#db2777", text: "#fff" },

      { id: "1", label: "1", mult: 1, color: "#0ea5e9", text: "#fff" },
      { id: "2", label: "2", mult: 2, color: "#eab308", text: "#000" },
      { id: "1", label: "1", mult: 1, color: "#0ea5e9", text: "#fff" },
      { id: "5", label: "5", mult: 5, color: "#db2777", text: "#fff" },
      { id: "1", label: "1", mult: 1, color: "#0ea5e9", text: "#fff" },
      { id: "2", label: "2", mult: 2, color: "#eab308", text: "#000" },
      { id: "10", label: "10", mult: 10, color: "#7c3aed", text: "#fff" },
      { id: "COIN GIFT", label: "COIN", mult: 15, color: "#dc2626", text: "#fff" }
    ];

    const TOTAL_SLOTS = CRAZY_SECTORS.length; // 54 сектора
    const ARC = (2 * Math.PI) / TOTAL_SLOTS;

    const canvas = document.getElementById("crazyWheelCanvas");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 2;
    const canvasSize = 320;

    canvas.width = canvasSize * dpr;
    canvas.height = canvasSize * dpr;
    ctx.scale(dpr, dpr);

    let currentAngle = 0;
    let lastPinIndex = -1;
    let pointerSwing = 0;
    const pointerSvg = document.getElementById("pointerSvg");

    function renderCrazyWheel(rot) {
      const cx = canvasSize / 2;
      const cy = canvasSize / 2;
      const radius = cx - 5;

      ctx.clearRect(0, 0, canvasSize, canvasSize);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      // 1. Отрисовка секторов
      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const radStart = i * ARC;
        const s = CRAZY_SECTORS[i];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, radStart, radStart + ARC);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();

        ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
        ctx.lineWidth = 1;
        ctx.stroke();

        // Текст сектора
        ctx.save();
        ctx.rotate(radStart + ARC / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = s.text;
        ctx.font = s.isCrazy ? "900 12px 'Outfit', sans-serif" : "900 11px 'Outfit', sans-serif";
        ctx.fillText(s.label, radius - 16, 0);
        ctx.restore();
      }

      // 2. Золотой внешний обод
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 9;
      ctx.strokeStyle = "#ca8a04";
      ctx.stroke();

      // 3. Золотые лампочки по ободу (как на видео)
      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const rad = i * ARC + (ARC / 2);
        const bx = Math.cos(rad) * (radius - 4.5);
        const by = Math.sin(rad) * (radius - 4.5);
        ctx.beginPath();
        ctx.arc(bx, by, 1.8, 0, 2 * Math.PI);
        ctx.fillStyle = (i % 2 === 0) ? "#fef08a" : "#f59e0b";
        ctx.fill();
      }

      // 4. Металлические штифты (Pegs)
      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const pinRad = i * ARC;
        const px = Math.cos(pinRad) * (radius - 0.5);
        const py = Math.sin(pinRad) * (radius - 0.5);
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // 5. Центр колеса: CRAZY GIFT с лучами (1 в 1 как на видео)
      ctx.beginPath();
      ctx.arc(0, 0, 48, 0, 2 * Math.PI);
      ctx.fillStyle = "#581c87";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#facc15";
      ctx.stroke();

      // Лучи
      for (let j = 0; j < 12; j++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 46, (j * 30 * Math.PI) / 180, ((j * 30 + 15) * Math.PI) / 180);
        ctx.fillStyle = "rgba(250, 204, 21, 0.15)";
        ctx.fill();
      }

      // Текст центрального логотипа
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "italic 900 13px 'Outfit', sans-serif";
      ctx.fillStyle = "#facc15";
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 4;
      ctx.fillText("CRAZY", 0, -8);
      ctx.fillText("GIFT", 0, 8);
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    // Физика тиканья стрелки
    function checkPointerTick(rot) {
      const norm = (rot % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const topAngle = ((3 * Math.PI / 2) - norm + 4 * Math.PI) % (2 * Math.PI);
      const curPin = Math.floor(topAngle / ARC);

      if (curPin !== lastPinIndex) {
        lastPinIndex = curPin;
        pointerSwing = 22;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      }
      pointerSwing *= 0.82;
      pointerSvg.style.transform = `rotate(${pointerSwing}deg)`;
    }

    renderCrazyWheel(0);

    /* ========================================================= */
    /* 3. СТАВКИ И УПРАВЛЕНИЕ                                   */
    /* ========================================================= */
    let isSpinning = false;

    function handlePlaceBet(sectorId) {
      if (isSpinning) return;

      const betVal = parseInt(document.getElementById("betAmountInput").value) || 20;
      if (userBalance < betVal) {
        alert("Недостаточно 💎 на балансе!");
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }

      userBalance -= betVal;
      activeBets[sectorId] += betVal;
      updateBalanceUI();

      const chip = document.getElementById(`chip-${sectorId}`);
      if (chip) {
        chip.classList.add("active");
        chip.textContent = activeBets[sectorId];
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
    }

    function stepBetAmount(delta) {
      const inp = document.getElementById("betAmountInput");
      let val = Math.max(1, (parseInt(inp.value) || 20) + delta);
      inp.value = val;
    }

    function clearAllBets() {
      if (isSpinning) return;
      for (let k in activeBets) {
        userBalance += activeBets[k];
        activeBets[k] = 0;
        const chip = document.getElementById(`chip-${k}`);
        if (chip) chip.classList.remove("active");
      }
      updateBalanceUI();
    }

    /* ========================================================= */
    /* 4. ИГРОВОЙ ЦИКЛ, СУПЕР-ЗУМ И TOP SLOT                     */
    /* ========================================================= */
    let roundTimer = 10;
    let roundTimerHandle = null;
    let roundBonus = { target: null, multiplier: 1 };

    function startBettingCountdown() {
      isSpinning = false;
      roundTimer = 10;

      // Возвращаем колесо и консоль на исходные позиции
      document.getElementById("wheelRig").classList.remove("super-zoom");
      document.getElementById("bettingConsole").classList.remove("slide-down");
      document.getElementById("resultModalOverlay").classList.remove("show");
      document.getElementById("topSlotHeaderResult").classList.remove("visible");

      // Снимаем блокировку кнопок
      document.querySelectorAll(".bet-btn").forEach(b => b.classList.remove("locked"));
      document.querySelectorAll(".mult-badge-on-btn").forEach(m => m.classList.remove("active"));

      // Статус: "Ставки / 10 / ставь"
      const statusCap = document.getElementById("statusCapsule");
      statusCap.classList.remove("spinning");
      document.getElementById("scTitle").textContent = "Ставки";
      document.getElementById("scTimer").textContent = roundTimer;
      document.getElementById("scSub").textContent = "ставь";

      clearInterval(roundTimerHandle);
      roundTimerHandle = setInterval(() => {
        roundTimer--;
        if (roundTimer > 0) {
          document.getElementById("scTimer").textContent = roundTimer;
        } else {
          clearInterval(roundTimerHandle);
          startRoundSpin();
        }
      }, 1000);
    }

    function startRoundSpin() {
      isSpinning = true;
      // Блокируем кнопки ставок без мыла (остаются четкими)
      document.querySelectorAll(".bet-btn").forEach(b => b.classList.add("locked"));

      // Статус меняется на: "Крутится / ждём" (1 в 1 как на видео 00:04)
      const statusCap = document.getElementById("statusCapsule");
      statusCap.classList.add("spinning");
      document.getElementById("scTitle").textContent = "Крутится";
      document.getElementById("scTimer").textContent = "";
      document.getElementById("scSub").textContent = "ждём";

      // 1. Выбираем сектор
      const targetSectorIdx = Math.floor(Math.random() * TOTAL_SLOTS);
      const targetSector = CRAZY_SECTORS[targetSectorIdx];

      // 2. Рассчитываем Top Slot
      const slotTargets = ["1", "2", "5", "10", "COIN GIFT", "CASH GIFT", "Pach GIFT", "CRAZY GIFT"];
      const slotMultipliers = [2, 3, 5, 7, 10, 15, 20, 25, 50];
      const isSlotHit = Math.random() < 0.65;
      const hitMult = slotMultipliers[Math.floor(Math.random() * slotMultipliers.length)];
      const hitTarget = (Math.random() < 0.45) ? targetSector.id : slotTargets[Math.floor(Math.random() * slotTargets.length)];

      roundBonus = {
        target: isSlotHit ? hitTarget : null,
        multiplier: isSlotHit ? hitMult : 1
      };

      // 3. Показываем результат Top Slot вверху через 2.5с
      setTimeout(() => {
        if (roundBonus.target) {
          const tsRes = document.getElementById("topSlotHeaderResult");
          const symBadge = document.getElementById("tsBadgeSym");
          document.getElementById("tsBadgeMultVal").textContent = `x${roundBonus.multiplier}`;
          symBadge.textContent = roundBonus.target.split(" ")[0];

          // Цвет бейджа
          if (roundBonus.target === "1") symBadge.style.background = "#0284c7";
          else if (roundBonus.target === "2") symBadge.style.background = "#d97706";
          else if (roundBonus.target === "5") symBadge.style.background = "#db2777";
          else if (roundBonus.target === "10") symBadge.style.background = "#7c3aed";
          else symBadge.style.background = "#b91c1c";

          tsRes.classList.add("visible");

          // Прикрепляем икс к кнопке ставки
          const btnMult = document.getElementById(`mult-${roundBonus.target}`);
          if (btnMult) {
            btnMult.textContent = `x${roundBonus.multiplier}`;
            btnMult.classList.add("active");
          }
        }
      }, 2500);

      // 4. Физика вращения колеса с СУПЕР-ЗУМОМ
      executeCrazyWheelMotion(targetSectorIdx, targetSector);
    }

    function executeCrazyWheelMotion(targetIdx, winSector) {
      const startTime = performance.now();
      const spinDuration = 9500;

      const startAngle = currentAngle;
      const targetCenter = targetIdx * ARC + (ARC / 2);
      const targetOffset = (3 * Math.PI / 2 - targetCenter) % (2 * Math.PI);
      const extraRotations = 8 * (2 * Math.PI);
      const finalAngle = startAngle + extraRotations + ((targetOffset - (startAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI));

      let zoomStarted = false;

      function renderFrame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / spinDuration);

        // Плавное торможение
        const ease = 1 - Math.pow(1 - progress, 3.4);
        currentAngle = startAngle + (finalAngle - startAngle) * ease;

        renderCrazyWheel(currentAngle);
        checkPointerTick(currentAngle);

        // СУПЕР-ЗУМ за 3.2с до конца (колесо приближается очень близко, панель уезжает вниз)
        if (elapsed > spinDuration - 3400 && !zoomStarted) {
          zoomStarted = true;
          document.getElementById("wheelRig").classList.add("super-zoom");
          document.getElementById("bettingConsole").classList.add("slide-down");
        }

        if (progress < 1) {
          requestAnimationFrame(renderFrame);
        } else {
          settleRound(winSector);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    /* ========================================================= */
    /* 5. ИТОГИ РАУНДА И УМНОЖЕНИЕ МНОЖИТЕЛЯ                     */
    /* ========================================================= */
    function settleRound(winningSector) {
      const userBet = activeBets[winningSector.id] || 0;

      // БАЗОВЫЙ ИКС УМНОЖАЕТСЯ НА МНОЖИТЕЛЬ TOP SLOT
      let finalMultiplier = winningSector.mult;
      if (roundBonus.target === winningSector.id) {
        finalMultiplier = winningSector.mult * roundBonus.multiplier;
      }

      let wonAmount = 0;
      if (userBet > 0) {
        wonAmount = userBet * finalMultiplier;
        userBalance += wonAmount;
        updateBalanceUI();
        addHistoryRow("Выигрыш Crazy Gift", `+${wonAmount} 💎`, true);
      }

      // Показ окна результатов 1 в 1 со скриншота 00:19
      const modal = document.getElementById("resultModalOverlay");
      const symEl = document.getElementById("modalWinnerSym");
      const multEl = document.getElementById("modalWinnerMult");
      const statusEl = document.getElementById("modalUserStatus");
      const payoutEl = document.getElementById("modalPayoutVal");

      symEl.textContent = winningSector.label;
      multEl.textContent = (roundBonus.target === winningSector.id) ? `×${roundBonus.multiplier}` : "";
      multEl.style.display = (roundBonus.target === winningSector.id) ? "inline" : "none";

      if (winningSector.id === "1") symEl.style.background = "#0284c7";
      else if (winningSector.id === "2") symEl.style.background = "#d97706";
      else if (winningSector.id === "5") symEl.style.background = "#db2777";
      else if (winningSector.id === "10") symEl.style.background = "#7c3aed";
      else symEl.style.background = "#b91c1c";

      if (userBet > 0) {
        statusEl.textContent = "Ваш выигрыш:";
        payoutEl.textContent = `+${wonAmount.toFixed(2)}`;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      } else {
        statusEl.textContent = "Выиграли 525 игроков";
        payoutEl.textContent = "39 848.48";
      }

      modal.classList.add("show");

      // Очистка фишек
      for (let k in activeBets) {
        activeBets[k] = 0;
        const chip = document.getElementById(`chip-${k}`);
        if (chip) chip.classList.remove("active");
      }

      setTimeout(() => {
        modal.classList.remove("show");
        startBettingCountdown();
      }, 3800);
    }

    /* ========================================================= */
    /* 6. ПРОФИЛЬ И РЕАЛЬНЫЕ ДЕЙСТВИЯ                            */
    /* ========================================================= */
    function addHistoryRow(title, amountStr, isPos) {
      const feed = document.getElementById("historyFeed");
      const noHist = document.getElementById("noHistory");
      if (noHist) noHist.remove();

      const row = `
        <div class="history-item-row">
          <div class="hist-left">
            <div class="hist-circle-icon">
              <svg viewBox="0 0 24 24"><path d="${isPos ? 'M12 4v16m0 0l-6-6m6 6l6-6' : 'M12 20V4m0 0l-6 6m6-6l6 6'}"/></svg>
            </div>
            <div>
              <div class="hist-type">${title}</div>
              <div class="hist-time">Только что</div>
            </div>
          </div>
          <span class="hist-sum ${isPos ? 'pos' : 'neg'}">${amountStr}</span>
        </div>
      `;
      feed.insertAdjacentHTML("afterbegin", row);
    }

    function handleDeposit() {
      const val = prompt("Введите сумму пополнения 💎:", "100");
      if (val && !isNaN(val) && parseInt(val) > 0) {
        const amt = parseInt(val);
        userBalance += amt;
        updateBalanceUI();
        addHistoryRow("Пополнение баланса", `+${amt} 💎`, true);
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      }
    }

    function handleWithdraw() {
      const val = prompt("Введите сумму вывода 💎:", "50");
      if (val && !isNaN(val) && parseInt(val) > 0) {
        const amt = parseInt(val);
        if (amt > userBalance) {
          alert("Недостаточно средств!");
          return;
        }
        userBalance -= amt;
        updateBalanceUI();
        addHistoryRow("Вывод средств", `-${amt} 💎`, false);
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      }
    }

    function handlePromo() {
      const inp = document.getElementById("promoInput");
      const code = inp.value.trim().toUpperCase();
      if (code === "CRAZY" || code === "GIFT" || code === "START") {
        userBalance += 100;
        updateBalanceUI();
        addHistoryRow(`Промокод [${code}]`, "+100 💎", true);
        inp.value = "";
        alert("Промокод активирован: +100 💎!");
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      } else {
        alert("Неверный промокод");
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      }
    }

    /* ЗАПУСК */
    initTelegramProfile();
    updateBalanceUI();
    startBettingCountdown();
  </script>
</body>
</html>
