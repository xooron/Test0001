<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Crazy Time - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #090d16;
      --card-glass: rgba(22, 29, 47, 0.72);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent-cyan: #00b4d8;
      --accent-blue: #0098ea;
      --accent-gold: #f59e0b;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #8e9db7;
      --nav-height: 74px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 85% 0%, rgba(0, 152, 234, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 10% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(139, 92, 246, 0.18) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 16px));
    }

    /* ВЕРХНЯЯ ШАПКА */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(9, 13, 22, 0.78);
      border-bottom: 1px solid var(--card-border);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0098ea, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 152, 234, 0.4);
      font-size: 16px;
    }
    .logo-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* БАЛАНС СПРАВА */
    .balance-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 152, 234, 0.4);
      box-shadow: 0 0 20px rgba(0, 152, 234, 0.25);
      border-radius: 30px;
      padding: 7px 14px;
    }
    .balance-pill svg {
      width: 19px;
      height: 19px;
      fill: var(--accent-blue);
      filter: drop-shadow(0 0 6px var(--accent-blue));
    }
    .balance-amount {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .balance-unit {
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 700;
    }

    /* ВКЛАДКИ */
    .tab-page {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      animation: tabFadeIn 0.25s ease-out;
    }
    .tab-page.active {
      display: flex;
    }

    /* === СТРАНИЦА: ИГРА === */
    .game-arena {
      width: 100%;
      max-width: 440px;
      padding: 10px 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Плашка таймера и ожидания */
    .round-timer-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .round-timer-pill .time-sec {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-gold);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-gold);
      animation: dotPulse 1.2s infinite;
    }
    .live-dot.spinning {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* TOP SLOT */
    .top-slot-box {
      width: 100%;
      height: 60px;
      background: linear-gradient(135deg, rgba(20, 27, 43, 0.9), rgba(13, 17, 28, 0.95));
      border: 1.5px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(245, 158, 11, 0.12);
      border-radius: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      position: relative;
      overflow: hidden;
    }
    .top-slot-box::before {
      content: "TOP SLOT";
      position: absolute;
      top: 2px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-gold);
      opacity: 0.8;
    }

    .slot-reel {
      width: 46%;
      height: 42px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .reel-track {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      transition: transform 3.6s cubic-bezier(0.12, 0.85, 0.25, 1);
    }
    .reel-item {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .reel-item.mult {
      color: var(--accent-gold);
      font-size: 19px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
    }
    .reel-item.miss {
      color: #ef4444;
      font-size: 13px;
      opacity: 0.8;
    }
    .reel-item.symbol {
      color: var(--accent-cyan);
    }

    /* Вылетающий множитель */
    .flying-badge {
      position: fixed;
      z-index: 1000;
      padding: 6px 14px;
      border-radius: 30px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.9);
      pointer-events: none;
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.85s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    /* РУЛЕТКА И ЗУМ */
    .wheel-viewport {
      width: 320px;
      height: 320px;
      position: relative;
      margin: 4px 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }
    .wheel-camera {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 12%;
      transition: transform 1.6s cubic-bezier(0.18, 0.85, 0.25, 1);
    }
    .wheel-camera.zoomed {
      transform: scale(1.36) translateY(24px);
    }

    /* СТРЕЛОЧКА (ФЛАППЕР) */
    .flapper-pin-anchor {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
    }
    .flapper-head {
      width: 26px;
      height: 38px;
      background: linear-gradient(180deg, #ff3366, #99002b);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      border-top: 3px solid #f59e0b;
      transform-origin: top center;
      transition: transform 0.05s ease-out;
    }
    .flapper-head.tick {
      transform: rotate(24deg);
    }

    /* CANVAS КОЛЕСА */
    canvas#wheelCanvas {
      width: 310px;
      height: 310px;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 152, 234, 0.2);
    }

    /* 8 КНОПОК СТАВОК */
    .bets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      margin-bottom: 12px;
    }

    .bet-button {
      position: relative;
      height: 64px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--card-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.1s ease, border-color 0.2s, background-color 0.2s;
    }
    .bet-button:active {
      transform: scale(0.95);
    }
    .bet-button.has-bet {
      border-color: rgba(0, 180, 216, 0.8);
      background: rgba(0, 180, 216, 0.12);
      box-shadow: 0 0 16px rgba(0, 180, 216, 0.25);
    }
    .bet-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }

    .bet-name {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      text-align: center;
    }
    .bet-desc {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Фишка поставленной суммы на кнопке */
    .chip-placed {
      position: absolute;
      bottom: 3px;
      background: rgba(0, 152, 234, 0.95);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 8px;
      display: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .chip-placed.active {
      display: block;
    }

    /* Множитель от Top Slot */
    .topslot-mult-tag {
      position: absolute;
      top: -2px;
      right: -2px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      display: none;
      animation: tagPop 0.3s ease;
    }
    .topslot-mult-tag.visible {
      display: block;
    }

    /* Цветовые стили кнопок */
    .bet-button[data-target="1X"] { border-bottom: 3px solid var(--accent-cyan); }
    .bet-button[data-target="2X"] { border-bottom: 3px solid var(--accent-gold); }
    .bet-button[data-target="5X"] { border-bottom: 3px solid var(--accent-pink); }
    .bet-button[data-target="10X"] { border-bottom: 3px solid var(--accent-purple); }

    .bet-button[data-target="COIN GIFT"] { border-bottom: 3px solid #d97706; }
    .bet-button[data-target="CASH GIFT"] { border-bottom: 3px solid var(--accent-green); }
    .bet-button[data-target="PLIN GIFT"] { border-bottom: 3px solid #6366f1; }
    .bet-button[data-target="CRAZY GIFT"] { border-bottom: 3px solid var(--accent-red); background: rgba(239, 68, 68, 0.08); }

    .bet-button[data-target="COIN GIFT"] .bet-name,
    .bet-button[data-target="CASH GIFT"] .bet-name,
    .bet-button[data-target="PLIN GIFT"] .bet-name,
    .bet-button[data-target="CRAZY GIFT"] .bet-name {
      font-size: 11px;
    }

    /* ПАНЕЛЬ ВВОДА СУММЫ СТАВКИ */
    .bet-control-dock {
      width: 100%;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .bet-input-box {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .bet-input-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .bet-input-number {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      width: 100%;
    }

    .bet-chip-btns {
      display: flex;
      gap: 5px;
    }
    .chip-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 7px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.15);
    }
    .chip-btn.clear {
      color: #ef4444;
    }

    /* ОКНО РЕЗУЛЬТАТОВ РАУНДА */
    .round-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .round-modal-overlay.active {
      display: flex;
    }
    .round-modal-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(160deg, rgba(27, 36, 56, 0.95), rgba(11, 15, 26, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.8), 0 0 35px rgba(0, 152, 234, 0.3);
      padding: 24px 20px;
      text-align: center;
      animation: modalZoom 0.35s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .modal-round-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .modal-winning-sector {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-cyan);
      margin-bottom: 16px;
    }
    .modal-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .modal-info-row span:first-child {
      color: var(--text-muted);
    }
    .modal-info-row span:last-child {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
    }
    .user-win-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .user-win-pill span:last-child {
      color: #10b981;
      font-size: 17px;
    }
    .user-loss-pill {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .user-loss-pill span:last-child {
      color: #f87171;
    }

    /* === СТРАНИЦА: ИНВЕНТАРЬ === */
    .inventory-area {
      width: 100%;
      max-width: 440px;
      min-height: calc(80vh - var(--nav-height));
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .pepe-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      opacity: 0.14;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.5));
    }
    .inventory-empty-box {
      position: relative;
      z-index: 2;
      width: 100%;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 34px 20px;
      text-align: center;
    }
    .inventory-empty-icon {
      font-size: 46px;
      margin-bottom: 12px;
      display: inline-block;
      animation: floatPepe 3s ease-in-out infinite;
    }

    /* === СТРАНИЦА: ПРОФИЛЬ === */
    .profile-area {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-top-card {
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .profile-user-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 100px;
    }
    .tg-avatar-frame {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
      box-shadow: 0 0 20px rgba(0, 152, 234, 0.4);
    }
    .tg-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1a2236;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .tg-handle {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      max-width: 125px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-money-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }
    .action-btn {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s;
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    .action-btn.dep {
      background: linear-gradient(135deg, #0098ea, #00b4d8);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 152, 234, 0.35);
    }
    .action-btn.wth {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--card-border);
    }

    .promo-dock {
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .promo-input-field {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      text-transform: uppercase;
    }
    .promo-submit-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .promo-submit-btn:active {
      transform: scale(0.95);
    }

    .history-card {
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
    }
    .history-tabs-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 12px;
      gap: 6px;
    }
    .hist-tab-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

  <!-- ЛОГИКА ПРИЛОЖЕНИЯ -->
  <script>
    /* ========================================================= */
    /* 1. БАЛАНС, TELEGRAM АВТОРИЗАЦИЯ И ДАННЫЕ                 */
    /* ========================================================= */
    const tgApp = window.Telegram?.WebApp;
    if (tgApp) {
      try {
        tgApp.ready();
        tgApp.expand();
      } catch (e) {}
    }

    let userBalance = 100.00; // Ровно 100 GRAM по умолчанию
    const placedBets = {
      "1X": 0, "2X": 0, "5X": 0, "10X": 0,
      "COIN GIFT": 0, "CASH GIFT": 0, "PLIN GIFT": 0, "CRAZY GIFT": 0
    };

    function refreshBalance() {
      document.getElementById("balanceDisplay").textContent = userBalance.toFixed(2);
    }

    function initTelegramProfile() {
      const handleEl = document.getElementById("userHandle");
      const avatarEl = document.getElementById("userAvatarSlot");

      const tgUser = tgApp?.initDataUnsafe?.user;
      if (tgUser) {
        handleEl.textContent = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || "Telegram User");
        if (tgUser.photo_url) {
          avatarEl.innerHTML = `<img src="${tgUser.photo_url}" class="tg-avatar-img" alt="User Avatar" />`;
        } else {
          avatarEl.textContent = (tgUser.first_name || "U").charAt(0).toUpperCase();
        }
      } else {
        handleEl.textContent = "@telegram_user";
        avatarEl.textContent = "TG";
      }
    }

    function navigateTab(tabName, btnElem) {
      document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".navbar-btn").forEach(b => b.classList.remove("active"));

      document.getElementById(`tab-${tabName}`).classList.add("active");
      if (btnElem) btnElem.classList.add("active");

      if (tgApp?.HapticFeedback) tgApp.HapticFeedback.impactOccurred("light");
    }

    /* ========================================================= */
    /* 2. ШИРОКИЕ И КРАСИВЫЕ СЕКТОРА (32 СЕКТОРА ДЛЯ ЧЕТКОСТИ)  */
    /* ========================================================= */
    const WHEEL_SECTORS = [
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "COIN GIFT", label: "COIN", color: "#d97706", textColor: "#fff" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "5X", label: "5X", color: "#ec4899", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "CASH GIFT", label: "CASH", color: "#10b981", textColor: "#fff" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "10X", label: "10X", color: "#8b5cf6", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "PLIN GIFT", label: "PLIN", color: "#6366f1", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "5X", label: "5X", color: "#ec4899", textColor: "#fff" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "CRAZY GIFT", label: "CRAZY", color: "#ef4444", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "COIN GIFT", label: "COIN", color: "#d97706", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "5X", label: "5X", color: "#ec4899", textColor: "#fff" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "10X", label: "10X", color: "#8b5cf6", textColor: "#fff" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "CASH GIFT", label: "CASH", color: "#10b981", textColor: "#fff" },
      { id: "2X", label: "2X", color: "#f59e0b", textColor: "#000" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "PLIN GIFT", label: "PLIN", color: "#6366f1", textColor: "#fff" },
      { id: "5X", label: "5X", color: "#ec4899", textColor: "#fff" },
      { id: "1X", label: "1X", color: "#00b4d8", textColor: "#fff" },
      { id: "10X", label: "10X", color: "#8b5cf6", textColor: "#fff" }
    ];

    const TOTAL_SECTORS = WHEEL_SECTORS.length; // 32 сектора = широкие и разборчивые
    const ARC_PER_SECTOR = (2 * Math.PI) / TOTAL_SECTORS;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    // Четкий рендеринг под Retina
    const dpr = window.devicePixelRatio || 2;
    const canvasCssSize = 310;
    canvas.width = canvasCssSize * dpr;
    canvas.height = canvasCssSize * dpr;
    ctx.scale(dpr, dpr);

    let currentRotation = 0;
    let prevPinPassed = -1;

    function renderWheel(angle) {
      const cx = canvasCssSize / 2;
      const cy = canvasCssSize / 2;
      const radius = cx - 8;

      ctx.clearRect(0, 0, canvasCssSize, canvasCssSize);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // Отрисовка широких секторов
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const startRad = i * ARC_PER_SECTOR;
        const item = WHEEL_SECTORS[i];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startRad, startRad + ARC_PER_SECTOR);
        ctx.closePath();

        ctx.fillStyle = item.color;
        ctx.fill();

        // Граница секторов
        ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Четкий текст
        ctx.save();
        ctx.rotate(startRad + ARC_PER_SECTOR / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = item.textColor;
        ctx.font = "900 16px 'Outfit', sans-serif";
        ctx.fillText(item.label, radius - 26, 0);
        ctx.restore();
      }

      // Золотой внешний обод
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#ffd15c";
      ctx.stroke();

      // Металлические штифты
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const pinRad = i * ARC_PER_SECTOR;
        const px = Math.cos(pinRad) * (radius - 1);
        const py = Math.sin(pinRad) * (radius - 1);

        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#b45309";
        ctx.stroke();
      }

      // Центральная стеклянная шайба
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, 2 * Math.PI);
      ctx.fillStyle = "#090d16";
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#ffd15c";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, 2 * Math.PI);
      ctx.fillStyle = "#0098ea";
      ctx.fill();

      ctx.restore();
    }

    /* Флаппер: проверка штифтов при вращении */
    const flapperHead = document.getElementById("flapperHead");
    let flapperTimer = null;

    function monitorFlapper(angle) {
      const normalized = (angle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const pointerWheelAngle = ((3 * Math.PI / 2) - normalized + 4 * Math.PI) % (2 * Math.PI);
      const curPin = Math.floor(pointerWheelAngle / ARC_PER_SECTOR);

      if (curPin !== prevPinPassed) {
        prevPinPassed = curPin;
        flapperHead.classList.add("tick");
        if (flapperTimer) clearTimeout(flapperTimer);
        flapperTimer = setTimeout(() => {
          flapperHead.classList.remove("tick");
        }, 50);

        if (tgApp?.HapticFeedback) tgApp.HapticFeedback.impactOccurred("light");
      }
    }

    renderWheel(0);

    /* ========================================================= */
    /* 3. TOP SLOT БАРАБАНЫ                                     */
    /* ========================================================= */
    const SLOT_MULTIPLIERS = [2, 3, 5, 7, 10, 15, 20, 25, 50];
    const SLOT_TARGETS = ["1X", "2X", "5X", "10X", "COIN GIFT", "CASH GIFT", "PLIN GIFT", "CRAZY GIFT"];

    const trackMultiplier = document.getElementById("reelMultiplierTrack");
    const trackSymbol = document.getElementById("reelSymbolTrack");

    function buildTopSlotReels() {
      let mHtml = "";
      for (let i = 0; i < 22; i++) {
        if (i % 3 === 0) {
          mHtml += `<div class="reel-item miss">МИМО</div>`;
        } else {
          const m = SLOT_MULTIPLIERS[Math.floor(Math.random() * SLOT_MULTIPLIERS.length)];
          mHtml += `<div class="reel-item mult">x${m}</div>`;
        }
      }
      trackMultiplier.innerHTML = mHtml;

      let sHtml = "";
      for (let i = 0; i < 22; i++) {
        const s = SLOT_TARGETS[Math.floor(Math.random() * SLOT_TARGETS.length)];
        sHtml += `<div class="reel-item symbol">${s}</div>`;
      }
      trackSymbol.innerHTML = sHtml;
    }
    buildTopSlotReels();

    /* ========================================================= */
    /* 4. СТАВКИ: НАДЕЖНЫЙ МЕХАНИЗМ КЛИКА ПО КНОПКАМ            */
    /* ========================================================= */
    let isRoundLocked = false;

    function placeBetOnTarget(targetId) {
      if (isRoundLocked) return;

      const inputBet = parseFloat(document.getElementById("inputBetSize").value) || 0;
      if (inputBet < 0.10) {
        alert("Минимальная ставка 0.10 GRAM");
        return;
      }
      if (userBalance < inputBet) {
        alert("Недостаточно GRAM на балансе!");
        if (tgApp?.HapticFeedback) tgApp.HapticFeedback.notificationOccurred("error");
        return;
      }

      // Списываем сразу и фиксируем
      userBalance -= inputBet;
      placedBets[targetId] += inputBet;
      refreshBalance();

      // Обновляем отображение фишки на кнопке
      const btn = document.querySelector(`.bet-button[data-target="${targetId}"]`);
      const chip = document.getElementById(`chip-${targetId}`);
      if (btn && chip) {
        btn.classList.add("has-bet");
        chip.classList.add("active");
        chip.textContent = placedBets[targetId].toFixed(1);
      }

      if (tgApp?.HapticFeedback) tgApp.HapticFeedback.impactOccurred("medium");
    }

    function addToInputBet(amt) {
      const inp = document.getElementById("inputBetSize");
      let cur = parseFloat(inp.value) || 0;
      inp.value = (cur + amt).toFixed(2);
    }
    function doubleInputBet() {
      const inp = document.getElementById("inputBetSize");
      let cur = parseFloat(inp.value) || 0.10;
      inp.value = (cur * 2).toFixed(2);
    }
    function clearAllBets() {
      if (isRoundLocked) return;
      // Возвращаем все неразыгранные фишки обратно на баланс
      for (let key in placedBets) {
        userBalance += placedBets[key];
        placedBets[key] = 0;
        const btn = document.querySelector(`.bet-button[data-target="${key}"]`);
        const chip = document.getElementById(`chip-${key}`);
        if (btn) btn.classList.remove("has-bet");
        if (chip) {
          chip.classList.remove("active");
          chip.textContent = "0";
        }
      }
      refreshBalance();
    }

    function setBetButtonsLock(locked) {
      isRoundLocked = locked;
      document.querySelectorAll(".bet-button").forEach(b => b.disabled = locked);
    }

    /* ========================================================= */
    /* 5. ИГРОВОЙ ЦИКЛ CRAZY TIME (ТАЙМЕР, СЛОТ, ВРАЩЕНИЕ, ЗУМ) */
    /* ========================================================= */
    let roundTimerSeconds = 10;
    let roundTimerHandle = null;

    let activeRoundBonus = {
      isHit: false,
      multiplier: 1,
      target: null
    };

    function startWaitingLoop() {
      setBetButtonsLock(false);
      roundTimerSeconds = 10;

      // Сброс приближения колеса
      document.getElementById("wheelCameraView").classList.remove("zoomed");
      document.getElementById("roundLiveDot").className = "live-dot";
      document.getElementById("roundTimerLabel").textContent = "Ожидание:";
      document.getElementById("roundTimerVal").textContent = roundTimerSeconds + "с";

      // Сброс бейджей Top Slot на кнопках
      document.querySelectorAll(".topslot-mult-tag").forEach(t => {
        t.classList.remove("visible");
        t.textContent = "x0";
      });

      // Сброс барабанов слота
      trackMultiplier.style.transition = "none";
      trackSymbol.style.transition = "none";
      trackMultiplier.style.transform = "translateY(0px)";
      trackSymbol.style.transform = "translateY(0px)";

      clearInterval(roundTimerHandle);
      roundTimerHandle = setInterval(() => {
        roundTimerSeconds--;
        if (roundTimerSeconds > 0) {
          document.getElementById("roundTimerVal").textContent = roundTimerSeconds + "с";
        } else {
          clearInterval(roundTimerHandle);
          startSpinProcess();
        }
      }, 1000);
    }

    function startSpinProcess() {
      setBetButtonsLock(true); // Блокируем кнопки ставок
      document.getElementById("roundLiveDot").className = "live-dot spinning";
      document.getElementById("roundTimerLabel").textContent = "Колесо:";
      document.getElementById("roundTimerVal").textContent = "Крутится";

      // 1. Выбираем сектор выпадения
      const winningIndex = Math.floor(Math.random() * TOTAL_SECTORS);
      const winningItem = WHEEL_SECTORS[winningIndex];

      // 2. Рассчитываем Top Slot (70% выпадения)
      const isTopHit = Math.random() < 0.70;
      let slotMultiplier = 2;
      let slotTarget = null;

      if (isTopHit) {
        slotMultiplier = SLOT_MULTIPLIERS[Math.floor(Math.random() * SLOT_MULTIPLIERS.length)];
        slotTarget = (Math.random() < 0.45) ? winningItem.id : SLOT_TARGETS[Math.floor(Math.random() * SLOT_TARGETS.length)];
      }

      activeRoundBonus = {
        isHit: isTopHit,
        multiplier: slotMultiplier,
        target: slotTarget
      };

      // 3. Запуск барабанов Top Slot
      setTimeout(() => {
        const itemH = 42;
        trackMultiplier.style.transition = "transform 3.4s cubic-bezier(0.12, 0.85, 0.25, 1)";
        trackSymbol.style.transition = "transform 3.4s cubic-bezier(0.12, 0.85, 0.25, 1)";

        if (isTopHit) {
          trackMultiplier.children[14].className = "reel-item mult";
          trackMultiplier.children[14].textContent = `x${slotMultiplier}`;
          trackMultiplier.style.transform = `translateY(-${14 * itemH}px)`;

          trackSymbol.children[14].className = "reel-item symbol";
          trackSymbol.children[14].textContent = slotTarget;
          trackSymbol.style.transform = `translateY(-${14 * itemH}px)`;
        } else {
          trackMultiplier.children[14].className = "reel-item miss";
          trackMultiplier.children[14].textContent = "МИМО";
          trackMultiplier.style.transform = `translateY(-${14 * itemH - 12}px)`; // застревание между строк

          trackSymbol.children[14].textContent = SLOT_TARGETS[0];
          trackSymbol.style.transform = `translateY(-${14 * itemH}px)`;
        }
      }, 400);

      // 4. Полет множителя на кнопку ставки
      setTimeout(() => {
        if (activeRoundBonus.isHit) {
          flyMultiplierToButton(activeRoundBonus.multiplier, activeRoundBonus.target);
        }
      }, 3800);

      // 5. Физика колеса
      spinWheelWithZoom(winningIndex, winningItem);
    }

    function flyMultiplierToButton(mult, targetName) {
      const badge = document.getElementById("flyingMultiplierBadge");
      const slotBox = document.getElementById("topSlotCard").getBoundingClientRect();
      const targetBtn = document.querySelector(`.bet-button[data-target="${targetName}"]`);
      if (!targetBtn) return;

      const btnRect = targetBtn.getBoundingClientRect();

      badge.textContent = `x${mult}`;
      badge.style.opacity = "1";
      badge.style.top = `${slotBox.top + 8}px`;
      badge.style.left = `${slotBox.left + slotBox.width / 2 - 20}px`;
      badge.style.transform = "scale(1.3)";

      setTimeout(() => {
        badge.style.top = `${btnRect.top + 4}px`;
        badge.style.left = `${btnRect.left + btnRect.width / 2 - 20}px`;
        badge.style.transform = "scale(0.85)";
      }, 50);

      setTimeout(() => {
        badge.style.opacity = "0";
        const tag = document.getElementById(`tag-${targetName}`);
        if (tag) {
          tag.textContent = `x${mult}`;
          tag.classList.add("visible");
        }
      }, 900);
    }

    function spinWheelWithZoom(targetIndex, winningItem) {
      const startTime = performance.now();
      const spinDuration = 10000; // 10 секунд вращения

      const startAngle = currentRotation;
      const targetCenter = targetIndex * ARC_PER_SECTOR + (ARC_PER_SECTOR / 2);
      const targetStopMod = (3 * Math.PI / 2 - targetCenter) % (2 * Math.PI);
      const extraSpins = 9 * (2 * Math.PI);
      const totalDestAngle = startAngle + extraSpins + ((targetStopMod - (startAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI));

      let hasZoomed = false;

      function renderFrame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / spinDuration);

        // Плавное физическое торможение
        const ease = 1 - Math.pow(1 - progress, 3.4);
        currentRotation = startAngle + (totalDestAngle - startAngle) * ease;

        renderWheel(currentRotation);
        monitorFlapper(currentRotation);

        // Приближаем экран (зум) за 3 секунды до остановки
        if (elapsed > spinDuration - 3400 && !hasZoomed) {
          hasZoomed = true;
          document.getElementById("wheelCameraView").classList.add("zoomed");
        }

        if (progress < 1) {
          requestAnimationFrame(renderFrame);
        } else {
          finishRound(winningItem);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    /* ========================================================= */
    /* 6. ПОДВЕДЕНИЕ ИТОГОВ И ВЫПЛАТЫ                            */
    /* ========================================================= */
    function finishRound(winningItem) {
      if (tgApp?.HapticFeedback) tgApp.HapticFeedback.notificationOccurred("success");

      const betOnWinner = placedBets[winningItem.id] || 0;
      let totalMultiplier = 1;

      if (winningItem.id === "1X") totalMultiplier = 1;
      else if (winningItem.id === "2X") totalMultiplier = 2;
      else if (winningItem.id === "5X") totalMultiplier = 5;
      else if (winningItem.id === "10X") totalMultiplier = 10;
      else totalMultiplier = 25; // Бонуски дают 25x базу

      // Применяем множитель Top Slot, если совпал сектор
      if (activeRoundBonus.isHit && activeRoundBonus.target === winningItem.id) {
        totalMultiplier *= activeRoundBonus.multiplier;
      }

      let userWonGram = 0;
      if (betOnWinner > 0) {
        userWonGram = betOnWinner * (totalMultiplier + 1);
        userBalance += userWonGram;
        refreshBalance();
      }

      // Показ результатов в окне
      displayOutcomeModal(winningItem.id, userWonGram, betOnWinner > 0);

      // Сброс фишек ставок на кнопках перед новым раундом
      for (let k in placedBets) {
        placedBets[k] = 0;
        const btn = document.querySelector(`.bet-button[data-target="${k}"]`);
        const chip = document.getElementById(`chip-${k}`);
        if (btn) btn.classList.remove("has-bet");
        if (chip) {
          chip.classList.remove("active");
          chip.textContent = "0";
        }
      }
    }

    function displayOutcomeModal(sectorId, wonGram, isWin) {
      const modal = document.getElementById("roundResultModal");
      const secName = document.getElementById("resWinningSectorName");
      const totalPool = document.getElementById("resTotalWinGram");
      const winners = document.getElementById("resWinnersCount");
      const userRow = document.getElementById("resUserRow");
      const userOutcome = document.getElementById("resUserOutcome");

      secName.textContent = `СЕКТОР: ${sectorId}`;
      const randWinners = Math.floor(Math.random() * 38) + 7;
      winners.textContent = `${randWinners} чел.`;
      totalPool.textContent = `${(randWinners * (Math.random() * 12 + 4)).toFixed(2)} GRAM`;

      if (isWin && wonGram > 0) {
        userRow.className = "modal-info-row user-win-pill";
        userRow.querySelector("span:first-child").textContent = "Твой выигрыш:";
        userOutcome.textContent = `+${wonGram.toFixed(2)} GRAM`;
      } else {
        userRow.className = "modal-info-row user-loss-pill";
        userRow.querySelector("span:first-child").textContent = "Ставка:";
        userOutcome.textContent = "Мимо (0.00 GRAM)";
      }

      modal.classList.add("active");

      setTimeout(() => {
        modal.classList.remove("active");
        startWaitingLoop();
      }, 4200);
    }

    /* ========================================================= */
    /* 7. ПРОФИЛЬ, ПРОМОКОД И ИСТОРИЯ ОПЕРАЦИЙ                  */
    /* ========================================================= */
    let currentHistoryType = "deposit";
    const historyStore = {
      deposit: [
        { title: "Пополнение через TON", date: "Сегодня, 17:30", amount: "+50.00 GRAM", pos: true },
        { title: "Приветственный бонус", date: "Сегодня, 12:00", amount: "+50.00 GRAM", pos: true }
      ],
      withdraw: [
        { title: "Вывод на кошелек", date: "Вчера, 20:15", amount: "-30.00 GRAM", pos: false }
      ]
    };

    function renderHistoryFeed() {
      const container = document.getElementById("historyFeedContainer");
      const items = historyStore[currentHistoryType] || [];
      if (items.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:13px;">Операций пока нет</div>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="feed-row">
          <div>
            <div style="font-weight:800;">${item.title}</div>
            <div style="font-size:11px; color:var(--text-muted);">${item.date}</div>
          </div>
          <div class="feed-row-val ${item.pos ? 'pos' : 'neg'}">${item.amount}</div>
        </div>
      `).join("");
    }

    function setHistoryView(type) {
      currentHistoryType = type;
      document.getElementById("btnTabDep").classList.toggle("active", type === "deposit");
      document.getElementById("btnTabWth").classList.toggle("active", type === "withdraw");
      renderHistoryFeed();
      if (tgApp?.HapticFeedback) tgApp.HapticFeedback.selectionChanged();
    }

    function submitPromoCode() {
      const input = document.getElementById("promoCodeInput");
      const code = input.value.trim().toUpperCase();
      if (!code) {
        alert("Введите промокод!");
        return;
      }
      if (code === "CRAZY" || code === "GRAM" || code === "START100" || code === "PEPE") {
        userBalance += 20.00;
        refreshBalance();
        historyStore.deposit.unshift({
          title: `Промокод [${code}]`,
          date: "Только что",
          amount: "+20.00 GRAM",
          pos: true
        });
        if (currentHistoryType === "deposit") renderHistoryFeed();
        input.value = "";
        alert("Промокод активирован: +20.00 GRAM!");
        if (tgApp?.HapticFeedback) tgApp.HapticFeedback.notificationOccurred("success");
      } else {
        alert("Неверный промокод");
        if (tgApp?.HapticFeedback) tgApp.HapticFeedback.notificationOccurred("error");
      }
    }

    function openDepositPrompt() {
      const val = prompt("Введите сумму пополнения GRAM:", "50");
      if (val && !isNaN(val) && parseFloat(val) > 0) {
        const added = parseFloat(val);
        userBalance += added;
        refreshBalance();
        historyStore.deposit.unshift({
          title: "Пополнение баланса",
          date: "Только что",
          amount: `+${added.toFixed(2)} GRAM`,
          pos: true
        });
        if (currentHistoryType === "deposit") renderHistoryFeed();
        if (tgApp?.HapticFeedback) tgApp.HapticFeedback.notificationOccurred("success");
      }
    }

    function openWithdrawPrompt() {
      const val = prompt("Введите сумму вывода GRAM:", "20");
      if (val && !isNaN(val) && parseFloat(val) > 0) {
        const wth = parseFloat(val);
        if (wth > userBalance) {
          alert("Недостаточно средств на балансе!");
          return;
        }
        userBalance -= wth;
        refreshBalance();
        historyStore.withdraw.unshift({
          title: "Вывод на кошелек",
          date: "Только что",
          amount: `-${wth.toFixed(2)} GRAM`,
          pos: false
        });
        if (currentHistoryType === "withdraw") renderHistoryFeed();
        if (tgApp?.HapticFeedback) tgApp.HapticFeedback.notificationOccurred("success");
      }
    }

    /* ЗАПУСК ПРИЛОЖЕНИЯ */
    initTelegramProfile();
    refreshBalance();
    renderHistoryFeed();
    startWaitingLoop();
  </script>
</body>
</html>
