<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Crazy GRAM - Telegram Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --glass-panel: rgba(18, 24, 38, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-glow: rgba(0, 163, 255, 0.35);
      --gram-blue: #0098ea;
      --gram-glow: 0 0 20px rgba(0, 152, 234, 0.4);
      --gold: #ffbe1a;
      --bonus-pink: #ff2d78;
      --bonus-purple: #9b51e0;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --nav-height: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 152, 234, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(155, 81, 224, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(255, 45, 120, 0.15) 0%, transparent 45%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 16px));
    }

    /* Верхняя плашка с Балансом */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(7, 9, 14, 0.65);
      border-bottom: 1px solid var(--glass-border);
    }

    .balance-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid var(--glass-border-glow);
      box-shadow: var(--gram-glow);
    }

    .balance-icon {
      width: 22px;
      height: 22px;
      fill: var(--gram-blue);
      filter: drop-shadow(0 0 5px var(--gram-blue));
    }

    .balance-val {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .balance-currency {
      color: var(--gram-blue);
      font-size: 13px;
      font-weight: 700;
    }

    .live-status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-dim);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }
    .pulse-dot.waiting {
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    /* Экраны страниц */
    .screen-tab {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.25s ease-out;
    }
    .screen-tab.active {
      display: flex;
    }

    /* ========================================================= */
    /* СТРАНИЦА: ИГРА                                           */
    /* ========================================================= */
    .game-container {
      width: 100%;
      max-width: 440px;
      padding: 8px 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Таймер-статус */
    .timer-ribbon {
      margin-bottom: 8px;
      padding: 6px 16px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .timer-ribbon span {
      color: var(--gold);
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
    }

    /* TOP SLOT (Верхний Слот Crazy Time) */
    .top-slot {
      width: 94%;
      height: 64px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(28, 33, 52, 0.9), rgba(13, 16, 27, 0.95));
      border: 2px solid rgba(255, 190, 26, 0.4);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 20px rgba(255, 190, 26, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-around;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .top-slot::before {
      content: "TOP SLOT";
      position: absolute;
      top: 2px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--gold);
      opacity: 0.8;
    }

    .slot-reel {
      width: 45%;
      height: 44px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
    }
    .reel-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      width: 100%;
      top: 0;
      transition: transform 3.5s cubic-bezier(0.12, 0.8, 0.25, 1);
    }
    .reel-cell {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      width: 100%;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .reel-cell.miss {
      color: #ef4444;
      font-size: 13px;
      font-style: italic;
    }
    .reel-cell.multiplier {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 190, 26, 0.7);
      font-size: 19px;
    }
    .reel-cell.symbol {
      color: #38bdf8;
      font-size: 14px;
    }

    /* Летающий мультипликатор */
    .flying-mult {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      padding: 6px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffbe1a, #ff7b00);
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 0 25px rgba(255, 190, 26, 0.9);
      transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      transform: scale(0.4);
    }

    /* ЗОНА КОЛЕСА С ЗУМОМ */
    .wheel-viewport {
      width: 320px;
      height: 320px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 14px;
      perspective: 1000px;
    }

    .wheel-zoom-box {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 12%; /* Центр зума в область стрелочки */
      transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.25, 1);
    }
    .wheel-zoom-box.zoomed {
      transform: scale(1.35);
    }

    /* Стрелочка рулетки (Флаппер) */
    .wheel-flapper-wrap {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
      transform-origin: top center;
    }
    .flapper-body {
      width: 22px;
      height: 34px;
      background: linear-gradient(180deg, #ff416c, #8a0b29);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      border-top: 3px solid #ffbe1a;
      transition: transform 0.06s ease;
    }
    .flapper-body.tick {
      transform: rotate(26deg);
    }

    canvas#wheelCanvas {
      width: 310px;
      height: 310px;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 152, 234, 0.25);
    }

    /* ПАНЕЛЬ СТАВОК (8 КНОПОК) */
    .betting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      margin-bottom: 12px;
    }

    .bet-btn {
      position: relative;
      height: 60px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(22, 28, 45, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.15s ease;
    }
    .bet-btn:active {
      transform: scale(0.96);
    }
    .bet-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .bet-btn .label {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }
    .bet-btn .subtext {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dim);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Мультипликатор на кнопке, если топ слот выпал */
    .bet-btn-mult {
      position: absolute;
      top: -2px;
      right: -2px;
      background: linear-gradient(135deg, #ffbe1a, #ea580c);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 8px;
      box-shadow: 0 0 8px #ffbe1a;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bet-btn-mult.visible {
      display: block;
    }

    /* Спеццвета для кнопок */
    .bet-btn[data-target="1x"] { border-bottom: 3px solid #00c0ff; }
    .bet-btn[data-target="2x"] { border-bottom: 3px solid #ffbe1a; }
    .bet-btn[data-target="5x"] { border-bottom: 3px solid #ff2d78; }
    .bet-btn[data-target="10x"] { border-bottom: 3px solid #9b51e0; }

    .bet-btn[data-target="COIN GIFT"] { border-bottom: 3px solid #f59e0b; background: rgba(245, 158, 11, 0.08); }
    .bet-btn[data-target="CASH GIFT"] { border-bottom: 3px solid #10b981; background: rgba(16, 185, 129, 0.08); }
    .bet-btn[data-target="PLIN GIFT"] { border-bottom: 3px solid #6366f1; background: rgba(99, 102, 241, 0.08); }
    .bet-btn[data-target="CRAZY GIFT"] { border-bottom: 3px solid #ef4444; background: rgba(239, 68, 68, 0.1); }

    .bet-btn[data-target="COIN GIFT"] .label,
    .bet-btn[data-target="CASH GIFT"] .label,
    .bet-btn[data-target="PLIN GIFT"] .label,
    .bet-btn[data-target="CRAZY GIFT"] .label {
      font-size: 11px;
      text-align: center;
      font-weight: 900;
    }

    /* Поле ввода ставки */
    .bet-control-panel {
      width: 100%;
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(16px);
    }

    .bet-input-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .bet-input-wrap label {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .bet-input-wrap input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      width: 100%;
    }

    .quick-chips {
      display: flex;
      gap: 6px;
    }
    .chip-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip-btn:active {
      transform: scale(0.94);
    }

    /* Модальное окно результата раунда */
    .result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    .result-overlay.active {
      display: flex;
    }

    .result-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(160deg, rgba(28, 36, 58, 0.95), rgba(12, 16, 26, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 152, 234, 0.25);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      position: relative;
      animation: zoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .result-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .result-sector {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #38bdf8;
    }

    .result-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .result-stat-row span:first-child {
      color: var(--text-dim);
    }
    .result-stat-row span:last-child {
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: #fff;
    }
    .user-win-highlight {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .user-win-highlight span:last-child {
      color: #10b981;
      font-size: 16px;
    }
    .user-loss-highlight {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .user-loss-highlight span:last-child {
      color: #f87171;
    }

    /* ========================================================= */
    /* СТРАНИЦА: ИНВЕНТАРЬ (С ПРОЗРАЧНЫМ PLUSH PEPE)             */
    /* ========================================================= */
    .inventory-container {
      width: 100%;
      max-width: 440px;
      min-height: calc(80vh - var(--nav-height));
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Прозрачный Plush Pepe на фоне */
    .pepe-watermark-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 310px;
      height: 310px;
      opacity: 0.13;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.5));
    }

    .inventory-empty-card {
      position: relative;
      z-index: 2;
      width: 100%;
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 34px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .inventory-empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    .inventory-empty-card h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #fff;
    }
    .inventory-empty-card p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ========================================================= */
    /* СТРАНИЦА: ПРОФИЛЬ                                        */
    /* ========================================================= */
    .profile-container {
      width: 100%;
      max-width: 440px;
      padding: 16px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Верхняя карточка профиля */
    .profile-header-card {
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .profile-user-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 110px;
    }

    .tg-avatar-wrap {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--gram-blue), var(--bonus-pink));
      box-shadow: 0 0 20px rgba(0, 152, 234, 0.4);
    }
    .tg-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      color: #fff;
    }

    .tg-username {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      max-width: 130px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .profile-actions-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .action-btn {
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    .action-btn.deposit {
      background: linear-gradient(135deg, #0098ea, #00c6ff);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 152, 234, 0.4);
    }
    .action-btn.withdraw {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--glass-border);
    }
    .action-btn.withdraw:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Панель промокода */
    .promocode-panel {
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .promo-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .promo-input::placeholder {
      text-transform: none;
      color: var(--text-dim);
      font-size: 13px;
    }
    .promo-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .promo-btn:active {
      transform: scale(0.95);
    }

    /* История транзакций */
    .history-section {
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
    }
    .history-tabs {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .hist-tab-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hist-tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 110px;
    }
    .hist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      font-size: 13px;
    }
    .hist-item-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hist-item-date {
      font-size: 11px;
      color: var(--text-dim);
    }
    .hist-item-val {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
    }
    .hist-item-val.pos { color: #10b981; }
    .hist-item-val.neg { color: #f87171; }

    /* ========================================================= */
    /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (3 КНОПКИ)                       */
    /* ========================================================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom, 12px);
      background: rgba(10, 14, 23, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      width: 30%;
      height: 100%;
      transition: all 0.2s ease;
    }
    .nav-btn svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .nav-btn.active {
      color: var(--gram-blue);
    }
    .nav-btn.active svg {
      transform: translateY(-2px) scale(1.1);
      filter: drop-shadow(0 0 8px var(--gram-blue));
    }

    /* Анимации */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

</head>

      try {
        tg.ready();
        tg.expand();
      } catch (e) {
        console.warn("Telegram WebApp API not fully available:", e);
      }
    }

    let selectedBetType = "1x";

    function initUserProfile() {
      const usernameEl = document.getElementById("profileUsername");
      const avatarSlot = document.getElementById("profileAvatarSlot");

      const user = tg?.initDataUnsafe?.user;
      if (user) {
        const handle = user.username ? `@${user.username}` : (user.first_name || "Telegram User");
        usernameEl.textContent = handle;
        if (user.photo_url) {
          avatarSlot.innerHTML = `<img src="${user.photo_url}" class="tg-avatar" alt="Avatar"/>`;
        } else {
          avatarSlot.innerHTML = `<span>${(user.first_name || 'U').charAt(0).toUpperCase()}</span>`;
        }
      } else {
        usernameEl.textContent = "@durov";
        avatarSlot.innerHTML = `<span>P</span>`;
      }
    }

    function updateBalanceDisplay() {
      document.getElementById("userBalanceDisplay").textContent = userBalance.toFixed(2);
    }

    /* Навигация вкладок */
    function switchTab(tabId, btnElem) {
      document.querySelectorAll(".screen-tab").forEach(tab => tab.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      
      document.getElementById(`tab-${tabId}`).classList.add("active");
      if (btnElem) btnElem.classList.add("active");

      // Вибрация Telegram HapticFeedback
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    }

    /* Ставки */
    function selectBet(target) {
      selectedBetType = target;
      document.querySelectorAll(".bet-btn").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-target") === target);
      });
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

      input.value = Math.max(0.10, cur + val).toFixed(2);

    const ctx = canvas.getContext("2d");
    let currentWheelAngle = 0; // в радианах
    let lastPinIndex = -1;

    function drawWheel(angle) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = centerX - 14;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(angle);

      // Рисуем сегменты
      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const segAngle = i * SEGMENT_ANGLE;
        const cfg = SECTORS_CONFIG[i];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, segAngle, segAngle + SEGMENT_ANGLE);
        ctx.closePath();

        ctx.fillStyle = cfg.color;
        ctx.fill();

        // Разделители
        ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Текст сектора
        ctx.save();
        ctx.rotate(segAngle + SEGMENT_ANGLE / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = cfg.textColor;
        ctx.font = "bold 20px 'Outfit', sans-serif";
        ctx.fillText(cfg.label, radius - 32, 0);
        ctx.restore();
      }

      // Золотой обод колеса
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 12;
      ctx.strokeStyle = "#ffd15c";
      ctx.stroke();

      // Штифты (Pins/Pegs), об которые цепляется стрелка
      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const pinAngle = i * SEGMENT_ANGLE;
        const px = Math.cos(pinAngle) * (radius - 2);
        const py = Math.sin(pinAngle) * (radius - 2);

        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#d97706";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Центральная стеклянно-золотая шайба
      ctx.beginPath();
      ctx.arc(0, 0, 48, 0, 2 * Math.PI);
      ctx.fillStyle = "#0c101c";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#ffd15c";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, 2 * Math.PI);
      ctx.fillStyle = "#0098ea";
      ctx.fill();

      ctx.restore();
    }

    /* Проверка прохождения штифта через флаппер (вверху: -Math.PI / 2) */
    function checkPinStrike(angle) {
      // Нормализуем угол в диапазон [0, 2PI)
      const normalized = (angle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      // Верхняя точка в системе координат повернутого холста:
      const pointerAngleOnWheel = ((3 * Math.PI / 2) - normalized + 4 * Math.PI) % (2 * Math.PI);
      const pinIndex = Math.floor(pointerAngleOnWheel / SEGMENT_ANGLE);

      if (pinIndex !== lastPinIndex) {
        lastPinIndex = pinIndex;
        triggerFlapperTick();
      }
    }

    const flapperElem = document.getElementById("flapperElem");
    let flapperTimeout = null;

    function triggerFlapperTick() {
      flapperElem.classList.add("tick");
      if (flapperTimeout) clearTimeout(flapperTimeout);
      flapperTimeout = setTimeout(() => {
        flapperElem.classList.remove("tick");
      }, 55);

      // Легкий виброотклик при физическом контакте штифта
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    }

    /* Отрисовка начального состояния */
    drawWheel(0);

    /* ========================================================= */
    /* 3. ИНИЦИАЛИЗАЦИЯ TOP SLOT (БАРАБАНЫ)                      */
    /* ========================================================= */
    const TOP_SLOT_TARGETS = ["1x", "2x", "5x", "10x", "COIN GIFT", "CASH GIFT", "PLIN GIFT", "CRAZY GIFT"];
    const TOP_SLOT_MULTS = [2, 3, 5, 7, 10, 15, 20, 25, 50];

    const reelMultiplierStrip = document.getElementById("reelMultiplierStrip");
    const reelSymbolStrip = document.getElementById("reelSymbolStrip");

    function setupTopSlotReels() {
      // Заполняем полосу множителей: 18 ячеек, между которыми могут быть "Мимо"
      let multHtml = "";
      for (let i = 0; i < 24; i++) {
        if (i % 3 === 0) {
          multHtml += `<div class="reel-cell miss">МИМО</div>`;
        } else {
          const m = TOP_SLOT_MULTS[Math.floor(Math.random() * TOP_SLOT_MULTS.length)];
          multHtml += `<div class="reel-cell multiplier">x${m}</div>`;
        }
      }
      reelMultiplierStrip.innerHTML = multHtml;

      // Полоса секторов
      let symHtml = "";
      for (let i = 0; i < 24; i++) {
        const s = TOP_SLOT_TARGETS[Math.floor(Math.random() * TOP_SLOT_TARGETS.length)];
        symHtml += `<div class="reel-cell symbol">${s}</div>`;
      }
      reelSymbolStrip.innerHTML = symHtml;
    }
    setupTopSlotReels();

    /* ========================================================= */
    /* 4. ОСНОВНОЙ ИГРОВОЙ ЦИКЛ (STATE MACHINE)                  */
    /* ========================================================= */
    let gameState = "WAITING"; // WAITING -> SPINNING -> TOP_SLOT_RESOLVE -> DECELERATING -> ROUND_RESULT
    let countdownSec = 10;
    let countdownInterval = null;

    // Активный множитель раунда
    let currentRoundBonus = {
      hasMultiplier: false,
      multiplier: 1,
      target: null
    };

    function startWaitingPhase() {
      gameState = "WAITING";
      countdownSec = 10;

      // Сброс интерфейса и зума
      document.getElementById("wheelZoomBox").classList.remove("zoomed");
      document.getElementById("gamePhasePill").style.display = "flex";
      document.getElementById("statusPulseDot").className = "pulse-dot waiting";
      document.getElementById("gamePhaseText").textContent = "ОЖИДАНИЕ";
      document.getElementById("countdownTimerLabel").textContent = "Ожидание ставок:";
      document.getElementById("countdownNumber").textContent = countdownSec + "с";

      // Сброс бейджей множителей на кнопках
      document.querySelectorAll(".bet-btn-mult").forEach(el => {
        el.classList.remove("visible");
        el.textContent = "x0";
      });

      // Пересборка барабанов Top Slot
      reelMultiplierStrip.style.transition = "none";
      reelSymbolStrip.style.transition = "none";
      reelMultiplierStrip.style.transform = `translateY(0px)`;
      reelSymbolStrip.style.transform = `translateY(0px)`;

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdownSec--;
        if (countdownSec > 0) {
          document.getElementById("countdownNumber").textContent = countdownSec + "с";
        } else {
          clearInterval(countdownInterval);
          startSpinPhase();
        }
      }, 1000);
    }

    /* Запуск вращения рулетки и Top Slot */
    function startSpinPhase() {
      gameState = "SPINNING";
      document.getElementById("statusPulseDot").className = "pulse-dot";
      document.getElementById("gamePhaseText").textContent = "ВРАЩЕНИЕ";
      document.getElementById("countdownTimerLabel").textContent = "Колесо:";
      document.getElementById("countdownNumber").textContent = "Крутится...";

      // Списание ставки пользователя
      const betAmt = Math.max(0.10, parseFloat(document.getElementById("betAmountInput").value) || 0.10);
      userBalance = Math.max(0, userBalance - betAmt);
      updateBalanceDisplay();

      // Заранее определяем результат раунда
      const winningSectorIndex = Math.floor(Math.random() * NUM_SEGMENTS);
      const winningSector = SECTORS_CONFIG[winningSectorIndex];

      // Определяем результат Top Slot (70% шанс выпадения множителя, 30% мимо)
      const isTopSlotHit = Math.random() < 0.70;
      let topSlotMultVal = 2;
      let topSlotTarget = null;

      if (isTopSlotHit) {
        topSlotMultVal = TOP_SLOT_MULTS[Math.floor(Math.random() * TOP_SLOT_MULTS.length)];
        // 50% шанс что совпадет именно с выигрышным сектором колеса, или случайный
        topSlotTarget = (Math.random() < 0.5) ? winningSector.id : TOP_SLOT_TARGETS[Math.floor(Math.random() * TOP_SLOT_TARGETS.length)];
      }

      currentRoundBonus = {
        hasMultiplier: isTopSlotHit,
        multiplier: topSlotMultVal,
        target: topSlotTarget
      };

      // 1. Анимация прокрутки Top Slot
      setTimeout(() => {
        const cellHeight = 44;
        reelMultiplierStrip.style.transition = "transform 3.2s cubic-bezier(0.15, 0.85, 0.35, 1)";
        reelSymbolStrip.style.transition = "transform 3.2s cubic-bezier(0.15, 0.85, 0.35, 1)";

        if (isTopSlotHit) {
          // Выставляем выбранный множитель в ячейку 14
          reelMultiplierStrip.children[14].className = "reel-cell multiplier";
          reelMultiplierStrip.children[14].textContent = `x${topSlotMultVal}`;
          reelMultiplierStrip.style.transform = `translateY(-${14 * cellHeight}px)`;

          // Выставляем цель в ячейку 14
          reelSymbolStrip.children[14].className = "reel-cell symbol";
          reelSymbolStrip.children[14].textContent = topSlotTarget;
          reelSymbolStrip.style.transform = `translateY(-${14 * cellHeight}px)`;
        } else {
          // Мимо: останавливаем барабан на "МИМО" или между линиями
          reelMultiplierStrip.children[14].className = "reel-cell miss";
          reelMultiplierStrip.children[14].textContent = "МИМО";
          reelMultiplierStrip.style.transform = `translateY(-${14 * cellHeight - 12}px)`; // Сдвиг между линиями!

          reelSymbolStrip.children[14].textContent = TOP_SLOT_TARGETS[0];
          reelSymbolStrip.style.transform = `translateY(-${14 * cellHeight}px)`;
        }
      }, 500);

      // 2. После остановки слота: вылет множителя (если выпал)
      setTimeout(() => {
        if (currentRoundBonus.hasMultiplier) {
          launchFlyingMultiplier(currentRoundBonus.multiplier, currentRoundBonus.target);
        }
      }, 4000);

      // 3. Кинематика торможения колеса рулетки
      runWheelSpinPhysics(winningSectorIndex, winningSector);
    }

    /* Анимация полета множителя из слота на кнопку */
    function launchFlyingMultiplier(mult, targetName) {
      const flyingElem = document.getElementById("flyingMult");
      const slotBox = document.getElementById("topSlotContainer").getBoundingClientRect();
      const targetBtn = document.querySelector(`.bet-btn[data-target="${targetName}"]`);

      if (!targetBtn) return;

      const targetRect = targetBtn.getBoundingClientRect();

      flyingElem.textContent = `x${mult}`;
      flyingElem.style.opacity = "1";
      flyingElem.style.top = `${slotBox.top + 10}px`;
      flyingElem.style.left = `${slotBox.left + slotBox.width / 2 - 20}px`;
      flyingElem.style.transform = "scale(1.2)";

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

      setTimeout(() => {
        flyingElem.style.top = `${targetRect.top + 6}px`;
        flyingElem.style.left = `${targetRect.left + targetRect.width / 2 - 20}px`;
        flyingElem.style.transform = "scale(0.85)";
      }, 50);

      setTimeout(() => {
        flyingElem.style.opacity = "0";
        // Прикрепляем бейдж к кнопке
        const multBadge = document.getElementById(`btn-mult-${targetName}`);
        if (multBadge) {
          multBadge.textContent = `x${mult}`;
          multBadge.classList.add("visible");
        }
      }, 950);
    }

    /* Физика колеса (разгон, кручение, торможение и плавный накат с зумом) */
    function runWheelSpinPhysics(winningIndex, winningSector) {
      const startTime = performance.now();
      const totalDuration = 10500; // 10.5 секунд суммарно

      const startAngle = currentWheelAngle;
      // Расчет финального угла: стрелка сверху (-Math.PI/2).
      // Чтобы сектор winningIndex оказался под стрелкой:
      const targetSectorCenter = winningIndex * SEGMENT_ANGLE + (SEGMENT_ANGLE / 2);
      const desiredFinalMod = (3 * Math.PI / 2 - targetSectorCenter) % (2 * Math.PI);
      const fullRotations = 10 * (2 * Math.PI); // 10 полных оборотов
      const finalAngle = startAngle + fullRotations + ((desiredFinalMod - (startAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI));

      let zoomStarted = false;

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / totalDuration);

        // Функция замедления (плавный накат в конце cubic ease-out)
        const easeOut = 1 - Math.pow(1 - progress, 3.4);
        currentWheelAngle = startAngle + (finalAngle - startAngle) * easeOut;

        drawWheel(currentWheelAngle);
        checkPinStrike(currentWheelAngle);

        // Включаем зум приближения камеры за 3.5 секунды до конца, когда колесо тихо катится
        if (elapsed > totalDuration - 3800 && !zoomStarted) {
          zoomStarted = true;
          document.getElementById("wheelZoomBox").classList.add("zoomed");
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          // Остановка колеса!
          onWheelLanded(winningSector);
        }
      }

      requestAnimationFrame(frame);
    }

    /* Окончание раунда */
    function onWheelLanded(winningSector) {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

      const betAmt = Math.max(0.10, parseFloat(document.getElementById("betAmountInput").value) || 0.10);
      const isPlayerWin = (selectedBetType === winningSector.id);

      // Расчет множителя
      let baseMultiplier = 1;
      if (winningSector.id === "1x") baseMultiplier = 1;
      else if (winningSector.id === "2x") baseMultiplier = 2;
      else if (winningSector.id === "5x") baseMultiplier = 5;
      else if (winningSector.id === "10x") baseMultiplier = 10;
      else baseMultiplier = 25; // Бонуски по дефолту дают щедрый коэффициент

      // Если в Top Slot выпал этот же сектор — умножаем!
      if (currentRoundBonus.hasMultiplier && currentRoundBonus.target === winningSector.id) {
        baseMultiplier *= currentRoundBonus.multiplier;
      }

      let winAmount = 0;
      if (isPlayerWin) {
        winAmount = betAmt * (baseMultiplier + 1); // возврат ставки + выигрыш
        userBalance += winAmount;
        updateBalanceDisplay();
      }

      // Открываем модальное окно результатов
      showRoundResultModal(winningSector.id, winAmount, isPlayerWin);
    }

    function showRoundResultModal(sectorName, winAmount, isPlayerWin) {
      const modal = document.getElementById("resultModal");
      const sectorText = document.getElementById("modalSectorResult");
      const totalWinPool = document.getElementById("modalTotalWinPool");
      const winnersCount = document.getElementById("modalWinnersCount");
      const userWinRow = document.getElementById("modalUserWinRow");
      const userWinAmount = document.getElementById("modalUserWinAmount");

      sectorText.textContent = `СЕКТОР: ${sectorName}`;
      
      // Имитация живых данных раунда
      const randomWinners = Math.floor(Math.random() * 45) + 8;
      const randomTotal = (randomWinners * (Math.random() * 15 + 3)).toFixed(2);
      winnersCount.textContent = `${randomWinners} чел.`;
      totalWinPool.textContent = `${randomTotal} GRAM`;

      if (isPlayerWin && winAmount > 0) {
        userWinRow.className = "result-stat-row user-win-highlight";
        userWinRow.querySelector("span:first-child").textContent = "Твой выигрыш:";
        userWinAmount.textContent = `+${winAmount.toFixed(2)} GRAM`;
      } else {
        userWinRow.className = "result-stat-row user-loss-highlight";
        userWinRow.querySelector("span:first-child").textContent = "Ставка:";
        userWinAmount.textContent = "Мимо (0.00 GRAM)";
      }

      modal.classList.add("active");

      // Через 4.5 секунды закрываем результат и начинаем следующий 10с раунд
      setTimeout(() => {
        modal.classList.remove("active");
        startWaitingPhase();
      }, 4500);
    }

    /* ========================================================= */
    /* 5. ЛОГИКА ПРОФИЛЯ, ПРОМОКОДОВ И ИСТОРИИ                   */
    /* ========================================================= */
    let currentHistoryTab = "deposit";
    const historyData = {
      deposit: [
        { date: "Сегодня, 18:42", amount: "+50.00 GRAM", pos: true },
        { date: "Вчера, 12:15", amount: "+100.00 GRAM", pos: true },
        { date: "24 Окт, 09:30", amount: "+25.00 GRAM", pos: true }
      ],
      withdraw: [
        { date: "Вчера, 22:10", amount: "-60.00 GRAM", pos: false },
        { date: "22 Окт, 16:04", amount: "-45.00 GRAM", pos: false }
      ]
    };

    function renderHistory() {
      const container = document.getElementById("historyListContainer");
      const list = historyData[currentHistoryTab] || [];
      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:var(--text-dim);padding:20px;font-size:13px;">Операций пока нет</div>`;
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="hist-item">
          <div class="hist-item-left">
            <span style="font-weight:700;">${currentHistoryTab === 'deposit' ? 'Пополнение баланса' : 'Вывод на кошелек'}</span>
            <span class="hist-item-date">${item.date}</span>
          </div>
          <span class="hist-item-val ${item.pos ? 'pos' : 'neg'}">${item.amount}</span>
        </div>
      `).join("");
    }

    function switchHistoryTab(type) {
      currentHistoryTab = type;
      document.getElementById("btnHistDeposit").classList.toggle("active", type === 'deposit');
      document.getElementById("btnHistWithdraw").classList.toggle("active", type === 'withdraw');
      renderHistory();
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function activatePromo() {
      const input = document.getElementById("promoInput");
      const code = input.value.trim().toUpperCase();
      if (!code) {
        alert("Пожалуйста, введите промокод");
        return;
      }
      if (code === "CRAZY" || code === "GRAM" || code === "PEPE") {
        userBalance += 15.00;
        updateBalanceDisplay();
        input.value = "";
        alert("Промокод активирован! Вам начислено +15.00 GRAM");
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      } else {
        alert("Неверный промокод или истек срок действия");
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      }
    }

    function mockDeposit() {
      const amount = prompt("Введите сумму пополнения (GRAM):", "25");
      if (amount && !isNaN(amount) && parseFloat(amount) > 0) {
        const val = parseFloat(amount);
        userBalance += val;
        updateBalanceDisplay();
        historyData.deposit.unshift({
          date: "Только что",
          amount: `+${val.toFixed(2)} GRAM`,
          pos: true
        });
        if (currentHistoryTab === "deposit") renderHistory();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      }
    }

    function mockWithdraw() {
      const amount = prompt("Введите сумму для вывода на TON/GRAM кошелек:", "10");
      if (amount && !isNaN(amount) && parseFloat(amount) > 0) {
        const val = parseFloat(amount);
        if (val > userBalance) {
          alert("Недостаточно средств на балансе!");
          return;
        }
        userBalance -= val;
        updateBalanceDisplay();
        historyData.withdraw.unshift({
          date: "Только что",
          amount: `-${val.toFixed(2)} GRAM`,
          pos: false
        });
        if (currentHistoryTab === "withdraw") renderHistory();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      }
    }

    /* Первоначальный запуск */
    initUserProfile();
    updateBalanceDisplay();
    renderHistory();
    startWaitingPhase();
  </script>
</body>
</html>
